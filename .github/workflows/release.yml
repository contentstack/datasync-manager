name: Publish package to npmjs registry
on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - name: Check the release tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$PKG_VERSION" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run build-ts
      - name: Update npm
        run: npm install -g npm@latest
      - name: Release
        run: npm publish --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}

  upload-release-asset:
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build-ts
      - name: Pack
        run: npm pack
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./*.tgz --clobber
