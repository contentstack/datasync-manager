name: Publish package to npmjs registry
on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
      - run: npm ci
      - run: npm run build-ts
      - name: Update npm
        run: npm install -g npm@latest
      - name: Release
        run: npm publish --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}

  upload-release-asset:
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build-ts
      - name: Pack
        run: npm pack
      - name: Attach the tarball to the release
        run: gh release upload "${{ github.event.release.tag_name }}" ./*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
